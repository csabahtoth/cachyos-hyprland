[terminal]
# The VT to run the greeter on. Can be "next", "current" or a number
# designating the VT.
vt = 1

# The default session, also known as the greeter.
[default_session]

# `agreety` is the bundled agetty/login-lookalike. You can replace `/bin/sh`
# with whatever you want started, such as `sway`.
command = "tuigreet --remember --time --time-format '%A, %B %-d %Y %-I:%M %p' --asterisks --greeting 'Welcome to CachyOS' --theme 'text=white;time=white;container=black;border=cyan;title=white;greet=cyan;prompt=white;input=white;action=white;button=cyan' --cmd start-hyprland"
# command = "start-hyprland -- -c /etc/greetd/hyprland.conf"

# The user to run the command as. The privileges this user must have depends
# on the greeter. A graphical greeter may for example require the user to be
# in the `video` group.
user = "greeter"
